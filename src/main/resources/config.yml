  reload: '&a✓ Konfiguracja została pomyślnie przeładowana.'

  # GRACZ
  unknown-player: '&c✕ Nie znaleziono gracza.'

  # KOMENDY / UŻYCIE
  usage-mute: '&cUżycie: /greenchat mute <gracz> <czas> [powód]'
