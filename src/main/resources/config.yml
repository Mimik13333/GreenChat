  prefix: ''

  no-permission: '&c✕ Nie masz uprawnień.'

  # CHAT
  chat-disabled: '&c✕ Chat jest obecnie wyłączony.'
  chat-status-on: '&a✓ Chat został włączony.'
  chat-status-off: '&c✓ Chat został wyłączony.'
  cleared: '&a✓ Chat został pomyślnie wyczyszczony.'

  # MUTE
  muted: '&c✕ Zostałeś wyciszony. Pozostało: &f%time%&c.'
  mute-success: '&a✓ Pomyślnie wyciszono gracza &f%player% &ana &f%time%&a.'
  unmute-success: '&a✓ Pomyślnie odciszono gracza &f%player%&a.'
  unmuted-player: '&a✓ Zostałeś odciszony. Możesz ponownie pisać na czacie.'
